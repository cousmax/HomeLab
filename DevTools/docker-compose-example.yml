# DevTools Stack - Example Docker Compose Configuration
# This is a sample configuration showing all available services
# Use Scripts/generate-gitea-stack.py to create your customized version

networks:
  gitea-network:
    name: gitea-network
    driver: bridge

services:
  # Core Gitea Service
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea-db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=your-secure-password
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__SSH_DOMAIN=localhost
      - GITEA__server__ROOT_URL=http://localhost:3000
      - GITEA__server__SSH_PORT=2222
      - GITEA__security__INSTALL_LOCK=false
      - GITEA__log__LEVEL=Info
    restart: unless-stopped
    networks:
      - gitea-network
    volumes:
      - ./gitea/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"  # Web interface
      - "2222:22"    # SSH
    depends_on:
      - gitea-db

  # PostgreSQL Database
  gitea-db:
    image: postgres:15-alpine
    container_name: gitea-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=your-secure-password
      - POSTGRES_DB=gitea
    networks:
      - gitea-network
    volumes:
      - ./gitea/postgres:/var/lib/postgresql/data

  # Gitea Actions Runner (Optional)
  gitea-runner:
    image: gitea/act_runner:latest
    container_name: gitea-runner
    restart: unless-stopped
    environment:
      - GITEA_INSTANCE_URL=http://localhost:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=your-runner-token
      - GITEA_RUNNER_NAME=docker-runner
    volumes:
      - ./gitea/runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gitea-network
    depends_on:
      - gitea

  # Drone CI (Alternative to Gitea Actions)
  drone:
    image: drone/drone:latest
    container_name: drone
    restart: unless-stopped
    environment:
      - DRONE_GITEA_SERVER=http://localhost:3000
      - DRONE_GITEA_CLIENT_ID=your-oauth-client-id
      - DRONE_GITEA_CLIENT_SECRET=your-oauth-secret
      - DRONE_RPC_SECRET=your-rpc-secret
      - DRONE_SERVER_HOST=localhost:3001
      - DRONE_SERVER_PROTO=http
      - DRONE_USER_CREATE=username:admin,admin:true
    ports:
      - "3001:80"
    volumes:
      - ./drone/data:/data
    networks:
      - gitea-network
    depends_on:
      - gitea

  # Drone Runner
  drone-runner:
    image: drone/drone-runner-docker:latest
    container_name: drone-runner
    restart: unless-stopped
    environment:
      - DRONE_RPC_PROTO=http
      - DRONE_RPC_HOST=drone:80
      - DRONE_RPC_SECRET=your-rpc-secret
      - DRONE_RUNNER_CAPACITY=2
      - DRONE_RUNNER_NAME=docker-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gitea-network
    depends_on:
      - drone

  # Portainer (Container Management)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data
    networks:
      - gitea-network

  # Code Server (VS Code in Browser)
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PASSWORD=your-secure-password
      - SUDO_PASSWORD=your-secure-password
    volumes:
      - ./code-server/config:/config
      - /mnt/workspace:/config/workspace
    ports:
      - "8443:8443"
    restart: unless-stopped
    networks:
      - gitea-network
