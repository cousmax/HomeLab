# Example Docker Compose configuration for Nextcloud AIO
# This file is automatically generated by the installation script
# You can use this as a reference for manual deployments

version: '3.8'

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer

services:
  nextcloud-aio-mastercontainer:
    image: nextcloud/all-in-one:latest
    restart: always
    container_name: nextcloud-aio-mastercontainer
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Optional: Mount NFS storage for data directory
      # Uncomment and modify the line below if using NFS storage
      # - /mnt/nextcloud-nfs:/mnt/ncdata:rw
    ports:
      - 8080:8080
    environment:
      # Optional: Set custom data directory for NFS storage
      # Uncomment the line below if using NFS storage
      # - NEXTCLOUD_DATADIR=/mnt/ncdata
      
      # Optional: Set custom domain
      # - APACHE_PORT=11000
      # - APACHE_IP_BINDING=0.0.0.0
      
      # Optional: Skip domain validation (for local testing)
      # - SKIP_DOMAIN_VALIDATION=true
      
      # Optional: Additional environment variables
      # - NEXTCLOUD_UPLOAD_LIMIT=10G
      # - NEXTCLOUD_MAX_TIME=3600
      # - NEXTCLOUD_MEMORY_LIMIT=512M

# Note: When using NFS storage, ensure:
# 1. NFS client is installed and configured
# 2. NFS share is mounted to /mnt/nextcloud-nfs
# 3. Proper permissions are set (www-data:www-data or 33:33)
# 4. NFS share supports the necessary file operations for Nextcloud
